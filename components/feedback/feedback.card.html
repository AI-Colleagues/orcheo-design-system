<!-- @dsCard group="Components" viewport="700x280" name="Feedback — Toast, Tooltip, Dialog" subtitle="Notifications, hints, and modal dialog" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; padding: 24px; background: var(--ink-50); font-family: var(--font-sans); }
  .wrap { display: flex; gap: 28px; align-items: flex-start; }
  .col { display: flex; flex-direction: column; gap: 12px; }
  .lbl { font-family: var(--font-mono); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--text-subtle); }
  .always .orc-tooltip__bubble { opacity: 1 !important; transform: translateX(-50%) translateY(0) !important; }
  /* keep dialog scrim contained in the preview */
  .dialog-frame { position: relative; width: 320px; height: 220px; border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-sm); }
  .dialog-frame .orc-dialog__scrim { position: absolute; padding: 16px; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { Toast, Tooltip, Dialog, Button, IconButton } = window.OrcheoDesignSystem_f1e686;
  const Play = () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="6 3 20 12 6 21 6 3"/></svg>;
  function Demo() {
    return (
      <div className="wrap">
        <div className="col">
          <span className="lbl">Toasts</span>
          <Toast intent="success" title="Workflow saved" onClose={()=>{}}>Daily research digest is live.</Toast>
          <Toast intent="danger" title="Run failed" onClose={()=>{}}>Step 4 couldn't reach the API.</Toast>
          <span className="lbl" style={{marginTop:8}}>Tooltip</span>
          <span className="always" style={{marginTop:18}}>
            <Tooltip label="Run this workflow now" side="top"><IconButton label="Run" variant="solid"><Play/></IconButton></Tooltip>
          </span>
        </div>
        <div className="col">
          <span className="lbl">Dialog</span>
          <div className="dialog-frame">
            <Dialog open size="sm" title="Delete workflow?" description="This removes the workflow and its run history."
              footer={<><Button variant="ghost" size="sm">Cancel</Button><Button variant="danger" size="sm">Delete</Button></>}>
              <span style={{fontSize:13}}>24 stored runs will also be deleted.</span>
            </Dialog>
          </div>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
</script>
</body>
</html>
