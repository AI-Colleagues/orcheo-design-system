<!-- @dsCard group="Type" viewport="700x230" name="Type Scale" subtitle="~1.25 ratio · 2xs → 6xl" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px 24px; background: var(--surface-card); font-family: var(--font-display); }
  .row { display: flex; align-items: baseline; gap: 16px; padding: 3px 0; border-bottom: 1px dashed var(--border-subtle); }
  .row:last-child { border-bottom: none; }
  .spec { font-family: var(--font-mono); font-size: 10px; color: var(--text-subtle); width: 78px; flex: none; }
  .samp { color: var(--text-strong); font-weight: 500; letter-spacing: -0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
  <div class="row"><span class="spec">6xl · 76</span><span class="samp" style="font-size:46px">Orcheo</span></div>
  <div class="row"><span class="spec">4xl · 49</span><span class="samp" style="font-size:36px">Orchestrate agents</span></div>
  <div class="row"><span class="spec">2xl · 31</span><span class="samp" style="font-size:28px">Run your workflows</span></div>
  <div class="row"><span class="spec">xl · 25</span><span class="samp" style="font-size:23px">Section heading</span></div>
  <div class="row"><span class="spec">md · 17</span><span class="samp" style="font-size:17px; font-family:var(--font-sans)">Body large / lead paragraph</span></div>
  <div class="row"><span class="spec">base · 15</span><span class="samp" style="font-size:15px; font-family:var(--font-sans); font-weight:400">Product body text</span></div>
  <div class="row"><span class="spec">sm · 13</span><span class="samp" style="font-size:13px; font-family:var(--font-sans); font-weight:400; color:var(--text-muted)">Caption / helper text</span></div>
</body>
</html>
