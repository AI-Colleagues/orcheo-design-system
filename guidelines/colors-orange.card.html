<!-- @dsCard group="Colors" viewport="700x150" name="Orcheo Orange" subtitle="Primary brand ramp — sampled from the product icon hub" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px; background: var(--surface-card); font-family: var(--font-sans); }
  .row { display: flex; gap: 6px; }
  .sw { flex: 1; border-radius: var(--radius-sm); overflow: hidden; }
  .chip { height: 64px; }
  .meta { padding: 6px 4px 0; }
  .name { font-family: var(--font-mono); font-size: 11px; color: var(--text-strong); }
  .hex { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); text-transform: uppercase; }
  .base { outline: 2px solid var(--ink-950); outline-offset: 2px; border-radius: var(--radius-sm); }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--orange-50)"></div><div class="meta"><div class="name">50</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--orange-100)"></div><div class="meta"><div class="name">100</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--orange-200)"></div><div class="meta"><div class="name">200</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--orange-300)"></div><div class="meta"><div class="name">300</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--orange-400)"></div><div class="meta"><div class="name">400</div></div></div>
    <div class="sw base"><div class="chip" style="background:var(--orange-500)"></div><div class="meta"><div class="name">500</div><div class="hex">f87825</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--orange-600)"></div><div class="meta"><div class="name">600</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--orange-700)"></div><div class="meta"><div class="name">700</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--orange-800)"></div><div class="meta"><div class="name">800</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--orange-900)"></div><div class="meta"><div class="name">900</div></div></div>
  </div>
</body>
</html>
