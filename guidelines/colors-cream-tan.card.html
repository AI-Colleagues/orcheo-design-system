<!-- @dsCard group="Colors" viewport="700x170" name="Cream & Tan" subtitle="Parchment field + circuit-line connector colors" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px; background: var(--surface-card); font-family: var(--font-sans); display: flex; gap: 28px; }
  .group { flex: 1; }
  .label { font-family: var(--font-mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; }
  .row { display: flex; gap: 6px; }
  .sw { flex: 1; }
  .chip { height: 56px; border-radius: var(--radius-sm); border: 1px solid var(--border-subtle); }
  .name { font-family: var(--font-mono); font-size: 11px; color: var(--text-strong); padding-top: 6px; }
</style>
</head>
<body>
  <div class="group">
    <div class="label">Cream / parchment</div>
    <div class="row">
      <div class="sw"><div class="chip" style="background:var(--cream-50)"></div><div class="name">50</div></div>
      <div class="sw"><div class="chip" style="background:var(--cream-100)"></div><div class="name">100</div></div>
      <div class="sw"><div class="chip" style="background:var(--cream-200)"></div><div class="name">200</div></div>
      <div class="sw"><div class="chip" style="background:var(--cream-300)"></div><div class="name">300</div></div>
      <div class="sw"><div class="chip" style="background:var(--cream-400)"></div><div class="name">400</div></div>
    </div>
  </div>
  <div class="group">
    <div class="label">Tan / circuitry</div>
    <div class="row">
      <div class="sw"><div class="chip" style="background:var(--tan-200)"></div><div class="name">200</div></div>
      <div class="sw"><div class="chip" style="background:var(--tan-300)"></div><div class="name">300</div></div>
      <div class="sw"><div class="chip" style="background:var(--tan-400)"></div><div class="name">400</div></div>
      <div class="sw"><div class="chip" style="background:var(--tan-500)"></div><div class="name">500</div></div>
    </div>
  </div>
</body>
</html>
