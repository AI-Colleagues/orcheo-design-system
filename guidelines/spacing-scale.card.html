<!-- @dsCard group="Spacing" viewport="700x160" name="Spacing Scale" subtitle="4px base grid" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px; background: var(--surface-card); font-family: var(--font-mono); }
  .row { display: flex; align-items: flex-end; gap: 12px; }
  .col { text-align: center; }
  .bar { background: var(--orange-300); border-radius: var(--radius-xs) var(--radius-xs) 0 0; width: 100%; }
  .col { display: flex; flex-direction: column; align-items: center; }
  .v { font-size: 10px; color: var(--text-muted); margin-top: 6px; }
  .t { font-size: 9px; color: var(--text-subtle); }
</style>
</head>
<body>
  <div class="row">
    <div class="col" style="width:28px"><div class="bar" style="height:4px"></div><div class="v">1</div><div class="t">4</div></div>
    <div class="col" style="width:28px"><div class="bar" style="height:8px"></div><div class="v">2</div><div class="t">8</div></div>
    <div class="col" style="width:28px"><div class="bar" style="height:12px"></div><div class="v">3</div><div class="t">12</div></div>
    <div class="col" style="width:28px"><div class="bar" style="height:16px"></div><div class="v">4</div><div class="t">16</div></div>
    <div class="col" style="width:28px"><div class="bar" style="height:20px"></div><div class="v">5</div><div class="t">20</div></div>
    <div class="col" style="width:28px"><div class="bar" style="height:24px"></div><div class="v">6</div><div class="t">24</div></div>
    <div class="col" style="width:28px"><div class="bar" style="height:32px"></div><div class="v">8</div><div class="t">32</div></div>
    <div class="col" style="width:28px"><div class="bar" style="height:40px"></div><div class="v">10</div><div class="t">40</div></div>
    <div class="col" style="width:28px"><div class="bar" style="height:48px"></div><div class="v">12</div><div class="t">48</div></div>
    <div class="col" style="width:28px"><div class="bar" style="height:64px"></div><div class="v">16</div><div class="t">64</div></div>
    <div class="col" style="width:28px"><div class="bar" style="height:80px"></div><div class="v">20</div><div class="t">80</div></div>
  </div>
</body>
</html>
