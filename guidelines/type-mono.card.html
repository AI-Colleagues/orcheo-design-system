<!-- @dsCard group="Type" viewport="700x170" name="Mono & Eyebrow — IBM Plex Mono" subtitle="Node IDs, logs, code, and ALL-CAPS overlines" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px; background: var(--surface-card); font-family: var(--font-sans); }
  .eyebrow { font-family: var(--font-mono); font-size: 12px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--text-brand); }
  .code { font-family: var(--font-mono); font-size: 13px; color: var(--text-body); background: var(--surface-sunken); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); padding: 12px 14px; margin-top: 14px; line-height: 1.6; }
  .k { color: var(--orange-700); }
  .c { color: var(--text-subtle); }
</style>
</head>
<body>
  <div class="eyebrow">Agentic orchestration</div>
  <div class="code"><span class="k">run</span> node_7f3a · agent=<span class="k">researcher</span> · status=running<br><span class="c"># 12 steps · 3 connectors · started 0.4s ago</span></div>
</body>
</html>
