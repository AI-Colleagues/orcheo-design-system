<!-- @dsCard group="Spacing" viewport="700x190" name="Elevation" subtitle="Warm-tinted shadows + brand glow" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 28px 24px; background: var(--ink-50); font-family: var(--font-mono); }
  .row { display: flex; gap: 24px; align-items: center; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .box { width: 78px; height: 60px; background: var(--surface-card); border-radius: var(--radius-lg); }
  .v { font-size: 10px; color: var(--text-muted); }
  .glow { background: var(--orange-500); }
</style>
</head>
<body>
  <div class="row">
    <div class="col"><div class="box" style="box-shadow:var(--shadow-xs)"></div><div class="v">xs</div></div>
    <div class="col"><div class="box" style="box-shadow:var(--shadow-sm)"></div><div class="v">sm</div></div>
    <div class="col"><div class="box" style="box-shadow:var(--shadow-md)"></div><div class="v">md</div></div>
    <div class="col"><div class="box" style="box-shadow:var(--shadow-lg)"></div><div class="v">lg</div></div>
    <div class="col"><div class="box" style="box-shadow:var(--shadow-xl)"></div><div class="v">xl</div></div>
    <div class="col"><div class="box glow" style="box-shadow:var(--shadow-brand)"></div><div class="v">brand</div></div>
  </div>
</body>
</html>
